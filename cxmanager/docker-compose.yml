services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cxmanager
      POSTGRES_PASSWORD: cxmanager_dev
      POSTGRES_DB: cxmanager
    ports:
      - "5432:5432"
    volumes:
      - cxmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cxmanager_pgdata:
